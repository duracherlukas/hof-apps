<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Hof-Karte</title>
<meta name="description" content="Karte für den Hof: Leitungen, Schieber, Kabel, Grenzsteine und Flächen">
<meta name="theme-color" content="#1d2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hof-Karte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="center-screen"><div class="spinner"></div></div>

<section id="login" class="login" hidden>
  <img src="icons/icon-192.png" alt="" width="72" height="72">
  <h1>Hof-Karte</h1>
  <p class="muted">Melde dich mit deinem Hof-Konto an.</p>
  <form id="loginForm">
    <label class="field"><span>E-Mail</span><input class="input" id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Passwort</span><input class="input" id="loginPw" type="password" autocomplete="current-password" required></label>
    <div class="err-box" id="loginErr" hidden></div>
    <button class="btn primary" id="loginBtn">Anmelden</button>
  </form>
  <button class="link" id="forgotPw">Passwort vergessen?</button>
</section>

<div id="app" hidden>
  <div id="map"></div>

  <header class="topbar">
    <div class="title"><b id="hofName">Hof-Karte</b><small id="syncState"></small></div>
    <button class="round" id="btnList" aria-label="Liste"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="round" id="btnLayers" aria-label="Kartenebenen"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <button class="round" id="btnMore" aria-label="Mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>

  <div class="side-btns">
    <button class="round" id="btnHome" aria-label="Zum Hof"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></button>
    <button class="round" id="btnLocate" aria-label="Meine Position"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
  </div>
  <div class="gps-pill" id="gpsPill" hidden></div>

  <button class="fab" id="fab" aria-label="Neu einzeichnen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="crosshair" id="crosshair" hidden><span></span></div>
  <div class="drawbar" id="drawbar" hidden>
    <div class="draw-info"><b id="drawTitle"></b><small id="drawStats"></small></div>
    <div class="draw-btns" id="drawBtns"></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <button class="icon-btn" id="sheetBack" aria-label="Zurück" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""><button class="round" id="viewerClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !b.hidden) b.innerHTML = '<div class="err-box" style="margin:20px;max-width:420px">Die App startet nicht. Prüfe die Internetverbindung und lade neu. Wenn Firebase eingerichtet ist: Stimmen die Werte in config.js?</div>';
  }, 10000);
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
