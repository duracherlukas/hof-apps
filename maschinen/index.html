<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hof-Maschinen</title>
<meta name="description" content="Maschinenverwaltung für den Hof: Pickerl, Betriebsstunden, Wartung und Kosten">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maschinen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div></div>
<script>
  // Falls die App nicht startet: nach 8 Sekunden einen Hinweis zeigen statt endlos zu laden.
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !b.hidden) b.innerHTML = '<div class="err-box" style="margin:20px;max-width:420px">Die App startet nicht. Prüfe die Internetverbindung und lade die Seite neu. Wenn Firebase eingerichtet ist: Stimmen die Werte in config.js?</div>';
  }, 8000);
</script>

<section id="login" class="login" hidden>
  <img src="icons/icon-192.png" alt="" width="72" height="72">
  <h1 id="loginTitle">Hof-Maschinen</h1>
  <p class="muted">Melde dich mit deinem Hof-Konto an.</p>
  <form id="loginForm">
    <label class="field"><span>E-Mail</span><input class="input" id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Passwort</span><input class="input" id="loginPw" type="password" autocomplete="current-password" required></label>
    <div class="err-box" id="loginErr" hidden></div>
    <button class="btn primary" id="loginBtn">Anmelden</button>
  </form>
  <button class="link" id="forgotPw">Passwort vergessen?</button>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="title">
      <h1 id="hofName">Hof-Maschinen</h1>
      <small id="syncState"></small>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="demo-banner" id="demoBanner" hidden>
    Demo-Modus: Daten bleiben nur auf diesem Gerät. Für gemeinsame Daten Firebase einrichten (siehe Anleitung).
  </div>
  <main id="view"></main>

  <nav class="tabbar" aria-label="Navigation">
    <button class="tab on" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg><span>Übersicht</span>
    </button>
    <button class="tab" data-tab="machines">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="16" r="3.5"/><circle cx="18" cy="17" r="2.5"/><path d="M4 12V7h7l2 5h6v5h-1M10.5 16H15.5M7 7V4"/></svg><span>Maschinen</span>
    </button>
    <button class="fab" id="fab" aria-label="Neuer Eintrag">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="costs">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Kosten</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Verlauf</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <button class="icon-btn" id="sheetBack" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
