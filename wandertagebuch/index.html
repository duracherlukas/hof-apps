<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wandertagebuch</title>
<meta name="description" content="Persönliches Wandertagebuch mit Fotos, GPS und Statistik">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wandern">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-title"><h1 id="appTitle">Mein Wandertagebuch</h1><small id="topSub"></small></div>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" aria-label="Navigation">
    <button class="tab on" data-tab="diary"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Tagebuch</span></button>
    <button class="tab" data-tab="map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Karte</span></button>
    <button class="fab" id="fab" aria-label="Neue Wanderung"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Statistik</span></button>
    <button class="tab" data-tab="peaks"><svg viewBox="0 0 24 24"><path d="M2 20l7-12 4 6 2-3 7 9z"/></svg><span>Gipfel</span></button>
  </nav>
</div>

<!-- GPS-Aufzeichnung -->
<section id="rec" class="rec" hidden>
  <div id="recMap" class="rec-map"></div>
  <div class="rec-panel">
    <div class="rec-status" id="recStatus">GPS wird gesucht …</div>
    <div class="rec-stats">
      <div><b class="num" id="rTime">0:00</b><small>Zeit</small></div>
      <div><b class="num" id="rDist">0,0</b><small>km</small></div>
      <div><b class="num" id="rUp">0</b><small>Hm ↑</small></div>
      <div><b class="num" id="rAlt">–</b><small>Höhe</small></div>
    </div>
    <p class="rec-hint" id="recHint">Lass die App offen – der Bildschirm bleibt an. Handy einfach in die Tasche stecken.</p>
    <div class="rec-btns">
      <button class="btn" id="rPause">Pause</button>
      <button class="btn primary" id="rStop">Beenden</button>
    </div>
  </div>
</section>

<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <button class="icon-btn" id="sheetBack" aria-label="Zurück" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="vbtn prev" id="vPrev" aria-label="Vorheriges Foto"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="vbtn next" id="vNext" aria-label="Nächstes Foto"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="vbtn close" id="vClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
