<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausgaben</title>
<meta name="description" content="Kartenausgaben einlesen, Personen zuordnen und sehen, wer wie viel offen hat">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ausgaben">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title"><h1>Ausgaben</h1><small id="sub"></small></div>
  <button class="icon-btn" id="btnImport" aria-label="Umsätze einlesen" title="Umsätze aus Mein ELBA einlesen">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabbar" aria-label="Navigation">
  <button class="tab on" data-tab="todo"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg><span>Zuordnen</span><b class="dot" id="todoCount" hidden></b></button>
  <button class="tab" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.7.2 4.6 1.9 5.3 5"/></svg><span>Personen</span></button>
  <button class="fab" id="fab" aria-label="Ausgabe von Hand eintragen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="all"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Alle</span></button>
  <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Übersicht</span></button>
</nav>
<div class="overlay" id="overlay" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <button class="icon-btn" id="sheetBack" aria-label="Zurück" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<input type="file" id="fileCsv" accept=".csv,text/csv,text/plain,application/vnd.ms-excel" hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
