<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gäste-Verwaltung</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gäste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<div id="boot" class="center"><div class="spinner"></div></div>

<section id="login" class="login" hidden>
  <h1>Gäste-Verwaltung</h1>
  <p class="muted" style="text-align:center">Melde dich mit deinem Hof-Konto an (dasselbe wie bei der Maschinen-App).</p>
  <form id="loginForm">
    <label class="field"><span>E-Mail</span><input class="input" id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Passwort</span><input class="input" id="loginPw" type="password" autocomplete="current-password" required></label>
    <div class="err-box" id="loginErr" hidden></div>
    <button class="btn primary" id="loginBtn">Anmelden</button>
  </form>
  <p style="text-align:center"><button class="link-btn" id="forgotPw">Passwort vergessen?</button></p>
</section>

<div id="app" hidden>
  <div class="wrap">
    <header class="admin-top">
      <h1 id="topTitle">Bestellungen<small id="topSub"></small></h1>
      <a class="icon-btn" id="guestLink" href="index.html" target="_blank" rel="noopener" aria-label="Gästeseite ansehen" title="Gästeseite ansehen"></a>
    </header>
    <div class="demo-banner" id="demoBanner" hidden>Demo-Modus: Alles bleibt nur auf diesem Gerät. Für echte Bestellungen Firebase einrichten (siehe Anleitung).</div>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheetHost"></div>
<div id="printArea"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !b.hidden) b.innerHTML = '<div class="err-box" style="margin:20px">Die Verwaltung startet nicht. Prüfe die Internetverbindung. Wenn Firebase eingerichtet ist: Stimmen die Werte in config.js?</div>';
  }, 10000);
</script>
<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
